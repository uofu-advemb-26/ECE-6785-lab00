name: CMake
on: [push, pull_request]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  PICO_SDK_PATH: ${{ github.workspace }}/lib/pico-sdk
  FREERTOS_KERNEL_PATH: ${{ github.workspace }}/lib/FreeRTOS-Kernel
  UNITY_PATH: ${{ github.workspace }}/lib/unity
  OPENOCD_PATH: /usr/share/openocd
  PICO_TOOLCHAIN_PATH: /usr/bin

jobs:
  build:
    runs-on: ubuntu-slim
    # runs-on: [self-hosted, linux, x64]
    steps:
      - name: Clean workspace
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"

      - uses: actions/checkout@v3
        with:
          submodules: true
          path: ${{github.workspace}}/source

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install cmake -y

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        working-directory: ${{github.workspace}}
        run:  cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{github.workspace}}
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories, but this is only available with CMake 3.13 and higher.
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -B ./build ./source

      - name: Build
        working-directory: ${{github.workspace}}
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build ./build --config $BUILD_TYPE --parallel $(nproc)

      # NOTE: The flashing runner is not currently set up
